<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 640px at 50% -12%, #1a2330 0%, #0b0d10 56%, #07080b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8edf5;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .card { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    animation: breathe 2.6s ease-in-out infinite;
  }
  h1 { margin: 26px 0 8px; font-size: 22px; font-weight: 600; letter-spacing: 0.4px; }
  p.sub { margin: 0; color: #8d99ab; font-size: 13px; }
  .loader {
    margin-top: 30px;
    width: 240px;
    height: 3px;
    border-radius: 3px;
    background: #1c232e;
    overflow: hidden;
    position: relative;
  }
  .loader::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 42%;
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #3b6cf6, #8b5cf6);
    animation: slide 1.5s ease-in-out infinite;
  }
  .hint { margin-top: 18px; color: #5f6b7d; font-size: 12px; }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(340%); }
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon.png" alt="DeepSeek Harness">
    <h1>DeepSeek Harness</h1>
    <p class="sub">正在启动本地服务…</p>
    <div class="loader"></div>
    <p class="hint">首次启动约需 10–30 秒，之后会秒开</p>
  </div>
</body>
</html>
